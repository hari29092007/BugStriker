version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bugstriker-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - bugstriker-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bugstriker-frontend
    ports:
      - "5173:5173"
    networks:
      - bugstriker-net
    restart: unless-stopped

networks:
  bugstriker-net:
    driver: bridge
